<script>
    // CASE -1
    async function greet() {
        return ("Hello!")
    }
    console.log(greet());
    /*Promise {<fulfilled>: 'Hello!'}
    [[Prototype]]: Promise
    [[PromiseState]]: "fulfilled"
    [[PromiseResult]]: "Hello!" */

    // CASE - 2
    async function greet2() {

    }
    console.log(greet2());
    /*
    [[Prototype]] : Promise
    [[PromiseState]]: "fulfilled"
    [[PromiseResult]]: undefined  
    Promise {<fulfilled>: undefined} */

    // CASE - 3
    async function greet3() {
        return abc.abc();
    }
    console.log(greet3());
    /*[[Prototype]]: Promise
    [[PromiseState]]: "rejected"
    [[PromiseResult]]: ReferenceError: abc is not defined at greet3 */

    // CASE - 4 
    async function greet4() {
        // return ("Hellow!")
        throw ("404 page not found") // code ma kyay pan error throw karava mate ano use thy che 
    }
    greet4()
        .then((data) => {  // ahi data parameter upar je lakhyu che as a return ae j lese jo tya return ("Hellow!") lakhyu hot to te return karet pan ahi hal ma 
        // catch vadu execute thy che tethi throw vadu return thyu ane catch vadu excute thyu
            console.log("promise was resolved")
            console.log("result was : ", data)
        })
        .catch((err) => {
            console.log("promise was rejected with err : ", err)
        })

    /*
===========================================================
        ASYNC FUNCTION - ERROR & PROMISE HANDLING
===========================================================

1) async function HAMESHA ek Promise return karta hai.

   async function greet() {
       return "Hello!";
   }

   console.log(greet());

   Output:
   Promise {<fulfilled>: "Hello!"}

   return value → Fulfilled Promise


-----------------------------------------------------------

2) Agar async function kuch return nahi karta:

   async function greet2() {

   }

   console.log(greet2());

   Output:
   Promise {<fulfilled>: undefined}

   No return → undefined → Fulfilled Promise


-----------------------------------------------------------

3) Agar async function ke andar ERROR aaye:

   async function greet3() {
       return abc.abc();
   }

   console.log(greet3());

   Yahan 'abc' defined nahi hai, isliye ReferenceError aayega.

   Lekin async function ke andar error:
   
       ERROR
         ↓
   Rejected Promise

   Output:
   Promise {<rejected>: ReferenceError...}

   IMPORTANT:
   Rejected Promise ko agar .catch() se handle nahi kiya,
   to baad me:

       Uncaught (in promise) ReferenceError

   dikhega.


-----------------------------------------------------------

4) throw ka use karke Promise ko reject kar sakte hain:

   async function greet4() {
       throw "404 page not found";
   }

   greet4()
       .then((data) => {
           console.log("Promise was resolved");
       })
       .catch((err) => {
           console.log("Promise was rejected:", err);
       });

   throw
      ↓
   Rejected Promise
      ↓
   .catch()
      ↓
   Error handle


-----------------------------------------------------------

IMPORTANT FLOW:

   async function
         ↓
   Always returns Promise
         ↓
   ┌───────────────────┐
   │                   │
 return value        Error/throw
   │                   │
   ↓                   ↓
Fulfilled           Rejected
 Promise              Promise
   │                   │
 .then()             .catch()
   │                   │
 Success              Error


-----------------------------------------------------------

WHY greet4() OUTPUT COMES BEFORE greet3() ERROR?

greet3() ka rejected Promise immediately create ho jata hai,
lekin uspar koi .catch() nahi hai.

JavaScript execution continue karti hai aur greet4() execute hota hai.

greet4() par .catch() already attached hai, isliye uska
error properly handle ho jata hai.

Baad me browser greet3() ke unhandled rejection ko report karta hai:

    Uncaught (in promise) ReferenceError


SHORT RULE:

    async + return  → Fulfilled Promise

    async + throw   → Rejected Promise

    Rejected Promise ko handle karne ke liye:

    .catch()  OR  try...catch

===========================================================
*/
