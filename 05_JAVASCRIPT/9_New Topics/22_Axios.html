<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Get random cat facts</h1>
    <button>Show new facts</button>
    <p id="result"></p>
</body>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script> <!-- axios ne connect karva mate -->
<script>
    let btn = document.querySelector("button")
    btn.addEventListener("click" ,async ()=>{
        let fact = await getFacts();
        console.log(fact)
        let p = document.querySelector("p")
        p.innerText = fact
    })

    let url = "https://catfact.ninja/fact"
    async function getFacts() {
        try {
            let res = await axios.get(url)
            return res.data.fact //ana thi apde let data = await res.json() aa vadu step skip kari didhu mtlb apde parse na karvu padyu parse mean ke apde json ne object ma 
            //no fervu padyu direct response thi apdne apdo data madi jay
        }catch(e){
            console.log(e)
            return "No facts found"
        }
        
    }
    getFacts();
</script>

</html>
