<script>
    // In some cases evu pan bani sake ke apda code ma rejected pan avi jay 
    // if apda code ma rejected avi gyu to tena pachi no code execute thato j nthi mtlb ke aa let a = 54 vadu execute j ny thy jo rejected avi gyu to aa vastu ne handle karva 
    // we use try and catch apdne jay evuu lage ke rejected thavani posiblity che tya ttry vado blok nakhi ddevano 
    // MOSTLY apde await jya use kari tene apde try block ma nakhi dai chiae 


    function changeColor(color, delay) {
        return new Promise((resolve, reject) => {
            setTimeout(() => {
                h1 = document.querySelector("h1")
                h1.style.color = color;
                console.log(`color change to ${color}`)

                let num = Math.floor(Math.random() * 5) + 1;
                if (num > 2) {
                    resolve("color change")  
                } else {
                    reject("promise rejected")
                }

            }, delay);
        })
    }

    async function demo() {
        try {
            await changeColor("red", 2000)
            await changeColor("purple", 2000)
            await changeColor("green", 2000)
            await changeColor("orange", 2000)
            await changeColor("blue", 2000)

        } catch(err){
            console.log("error caught");
            console.log(err);
        }
        let a = 54
        console.log(a)
    }
     
</script>
