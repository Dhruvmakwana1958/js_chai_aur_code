    <script>
        let newp = document.createElement("p")
        newp.innerText = "Hey there my name is dhruv makwana and i belive in my MAHADEV"

        let paradd = document.querySelector(".box");
        paradd.append(newp) // sharu ma append thelu ny dekhade kem ke laast ma ane remove karelu che 
 
        let btn = document.createElement("button");
        btn.innerText = "NEW BUTTON!"
        let mine = document.querySelector(".box h4")
        mine.insertAdjacentElement("beforebegin" , btn) // h4 start thya ni pela 
        // mine.insertAdjacentElement("afterbegin" , btn) // start thya ni pachi pan h4 ni andar j as it's first child avse 
        // mine.insertAdjacentElement("beforeend" , btn) // end thya ni pela pan h4 ni andar j as its first child avse
        // mine.insertAdjacentElement("afterend" , btn) // h4 end  thya ni pachi 
        // aa badha ne vara farti ak ak ne comment out kari ne jova kai rite work kare che

        
        
        
        // removeChild :- ena parent na adhre access kari sahkay (semilar to appendChild)
        let mine2 = document.querySelector(".box")
        mine2.removeChild(btn)

        // remove()
        paradd.remove(newp)

        // let clearBody = document.querySelector("body")
        // clearBody.remove()     // ana thi akhi body j remove thy jse



    </script>
