<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="5_5_classList.css">
</head>

<body>
    <div>
        <h3>Practice</h3>
        <h2 class="fruits mango orange"><i>Fruits</i></h2>
        <h3 class="fruits mango orange"><i>Avenger</i></h3>
        <h1>Dhruv Makwana</h1>
        <ul>
            <li>mango</li>
            <li>Orange</li>
            <li>kiwi</li>
        </ul>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSQHaRWxyz39EW8N1HMNGHM-fvt9HzJFtM2DLiVxCwQ-w&s=10"
            alt="spider" style="width: 17.75%;" id="spidy">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRIMkBlxUMG37ZNpLu8aXTLZVUOCzsOSh_q6isSMs0umA&s=10"
            alt="strange" style="width: 19.75%;" id="strenju">
    </div>

    <div class="box">
        <h4>Publication Info</h4>

        <ul>
            <li>
                <a href="#" class="boxLink">Publisher</a>
            </li>

            <li>
                <a href="#" class="boxLink">First Appearance</a>
            </li>

            <li>
                Created by
                <ul>
                    <li>
                        <a href="#" class="boxLink">Stan Lee</a>
                    </li>
                    <li>
                        <a href="#" class="boxLink">Steve Ditko</a> <br>
                        
                    </li>
                </ul>
            </li>
        </ul>
    </div>

    <script>
        let newp = document.createElement("p")
        newp.innerText = "Hey there"

        let paradd = document.querySelector(".box");
        paradd.appendChild(newp)

        // append() : Last ma add karva

        // 1) aa upar na add karela paragraph ma haji vadhu text add karva 
        
        newp.append(" This is new text")

        //appendChild :- ana thi apde koi parent na child ma change kari sakiae 
        // append     :- ana thi apde te j elemnt ni andar jai ne change kari sakiae

        let pra = document.querySelector(".box h4");
        pra.append(" MOj MAA REVU")

        // 2) niche banvela aa button ne aa <p> ni andar j append karva mate
        let btn = document.createElement("button")
        btn.innerText = "click me"

        newp.append(" " ,btn) 
        newp.append(" " , "do not click on this button")

        // we can frequently use append() , insted of use of appendChild


        // prepend() : start ma add karva
        let newh3 = document.createElement("h3")
        newh3.innerText = "Vishva Dodiya"
        paradd.prepend(newh3);


    </script>
</body>

</html>
