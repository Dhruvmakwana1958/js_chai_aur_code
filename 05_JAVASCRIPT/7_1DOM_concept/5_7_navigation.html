    <script>
        //parentElement
        let myparent = document.querySelector(".box h4")
        console.log(myparent.parentElement);
        
        //children
        let mychildern = document.querySelector(".box ul")
        console.log(mychildern.children)

        // childElementCount
        console.log(mychildern.childElementCount)

        // nextElementSibling
        console.log(mychildern.children[1].nextElementSibling)
        
        // previousElementSibling
        console.log(mychildern.children[1].previousElementSibling)
        
        
        let mine = document.querySelector("div ul")
        console.log(mine.nextElementSibling);

        mine.nextElementSibling.style.height = "21.20rem"
        mine.nextElementSibling.style.width = "16rem"

        let mine2 = document.querySelectorAll("div ul")[1];
        console.log(mine2.children[0].nextElementSibling)
