<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
    background-color: palevioletred;
}
    </style>
</head>
<body>
    <div>Dhruv Makwana</div>
    <h1 id="heading" class="heading-class">Dom demo by apna college</h1>
    <h1 class="heading-class">Karan rathore</h1>
    <h4 class="heading-class">topic : starter code</h4>
    <p>Let's Learn about DOM</p>
    <button>Click me</button>  
    <script>
        let heading = document.getElementById("heading");
        console.log(heading);
        console.dir(heading); // ahi script tag ne body pachi lakhvo jaruri che kem ke jo aa tag ne apne jo head ma lkyo hot to browser pela js
        //  na code ne run karet ane jo evu that to apde Document vada object ne access na kari saket
        let headings = document.getElementsByClassName("heading-class");
        console.log(headings);
        console.dir(headings);

        let newheading = document.getElementById("newheadings");
        let newestheading = document.getElementsByClassName("newestheadings");

        console.log(newheading);
        console.dir(newheading);

        console.log(newestheading);
        console.dir(newestheading);

        let tagname = document.getElementsByTagName("p");
        console.dir(tagname);

        document.getElementsByTagName("h4").innerText = "har har mahadev" //✖️
        document.getElementsByTagName("h4")[0].innerText = "har har mahadev" //✔️ 
        // ahi [0] etle apvo pdyo kem ke jo mani lo ke apda html ma jo 3 h4 tag hot to kya ne bolavo e kai rite khbr pdet 
        // ane aama as a array jevu j kam thy che pela elament ne 0 index apva ma ave che em j bija ne 1 .... to etle 
        // spde ahi specify karvu padyu
        document.querySelector("h4").innerText = "har har"                //✔️

        /*
        Bahut important concept hai. Rule yaad rakh lo:
Jab method ek collection (multiple elements) return karta hai, tab index dena padta hai.
Jab method ek single element return karta hai, tab index nahi dena padta.


               | Method                      | Return Type      |Single / Multiple           | Index (`[0]`) Chahiye? |                             Example                                                           |
| ------------------------------------------ | ------------------ | ------------------------ | ---------------------- | ----------------------------------------------------------------- |
| `document.getElementById("id")`            | **Element**        | ✅ Single                 | ❌ Nahi                 | `document.getElementById("heading").innerText = "Hello";`         |
| `document.querySelector("selector")`       | **Element**        | ✅ First Matching Element | ❌ Nahi                 | `document.querySelector("h1").style.color = "red";`               |
| `document.getElementsByTagName("tag")`     | **HTMLCollection** | ✅ Multiple               | ✔️ Haan                | `document.getElementsByTagName("h1")[0].innerText = "Hello";`     |
| `document.getElementsByClassName("class")` | **HTMLCollection** | ✅ Multiple               | ✔️ Haan                | `document.getElementsByClassName("box")[0].style.color = "blue";` |
| `document.getElementsByName("name")`       | **NodeList**       | ✅ Multiple               | ✔️ Haan                | `document.getElementsByName("gender")[0].checked = true;`         |
| `document.querySelectorAll("selector")`    | **NodeList**       | ✅ Multiple               | ✔️ Haan                | `document.querySelectorAll("p")[0].style.color = "green";`        |

        */
    </script> 
</body>
</html>
