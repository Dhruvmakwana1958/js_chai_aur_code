<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events in JS</title>
    <style>
        .mahakal{
            height: 100px;
            width: 100px;
            background-color: dodgerblue;
            border: 2px solid black;
            color: white;
        }

        .triangle {
            width: 0;
            height: 0;
            border-left: 100px solid transparent;
            border-right: 100px solid transparent;
            border-bottom: 180px solid red;
        }
    </style>
</head>

<body>
    <button type="button" id="btn">btn</button>
    <div class="mahakal">Har Har Mahadev</div><hr>
    <div class="triangle"></div>

    <script>

        // event object kevama ave che 
        let btn = document.querySelector("#btn");
        btn.onclick = (evt) => {
            console.log(evt)
            console.log(evt.type)
            console.log(evt.target)
            console.log(evt.clientX, evt.clientY)

        }
        let dev = document.querySelector(".mahakal")
        dev.onmouseover = (evt) => {
            console.log(evt)
            console.log(evt.type)
            console.log(evt.target)
            console.log(evt.clientX, evt.clientY)
        }

        // addEventListners

        let triangle = document.querySelector(".triangle")
        triangle.addEventListener("click" , () => {
            console.log("Shaktiman ji hello! 1")
        })
        
        triangle.addEventListener("click" , () => {
            console.log("Shaktiman ji hello! 2")
        })
        
        const handler3 = () =>{
            console.log("Shaktiman ji hello! 3")
        }
        
        triangle.addEventListener("click" , handler3)
        

        // removeEventListener

        triangle.removeEventListener("click" , handler3)

        


    </script>

</body>

</html>
