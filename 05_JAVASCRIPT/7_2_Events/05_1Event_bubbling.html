<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS</title>
    <style>
        div {
            background-color: pink;
            height: 200px;
            width: 400px;
        }

        ul {
            background-color: blue;
        }

        li {
            background-color: greenyellow;

        }
    </style>
</head>

<body>

    <div>
        <ul>
            <li>one</li>
            <li>two</li>
            <li>three</li>
        </ul>
    </div>

    <script>
        //event bubbling
        /*Child par click karne se event bubble hoke parent tak pahunchta hai. Parent us event ko handle karta hai. Isi technique ko Event Delegation kehte hain.*/
        let div = document.querySelector("div")
        let ul = document.querySelector("ul")
        let li = document.querySelector("li")

        div.addEventListener("click" , ()=>{
            console.log("div was clicked")
        })

        ul.addEventListener("click" , ()=>{
            console.log("ul was clicked")
        })

        li.addEventListener("click" , ()=>{
            console.log("li was clicked")
        })

        // div upar click karsu to :- div was clicked 

        // ul upar click karsu to :-   ul was clicked
        //                             div was clicked

        // li upar click karsu to :- li was clicked
        //                           ul was clicked
        //                           div was clicked
        
        // ane event bubbling kevay apde child element upar click karvi to y eno parent b click thy che
        
    </script>

</body>

</html>
