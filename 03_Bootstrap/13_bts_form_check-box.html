<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body>

    <div class="container">
        <h2>Form Demo</h2>
        <form class="mb-3">
            <div class="normal">
                <input type="checkbox" id="agree">
                <label for="agree">Agree</label>
            </div> <br>

            <div class="mb-3 form-check">
                <input class="form-check-input" type="checkbox" id="agreebt">
                <label class="form-check-label" for="agreebt">Agree</label>
            </div>

            <div class="mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="radio" id="rdbs" name="yu">
                    <label class="form-check-label" for="rdbs">Yes</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="radio" id="rdbs1" name="yu">
                    <label class="form-check-label" for="rdbs1">No</label>
                </div>
            </div>

            <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" role="switch" id="switchCheckDefault">
                <label class="form-check-label" for="switchCheckDefault">Default switch checkbox input</label>
            </div>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
