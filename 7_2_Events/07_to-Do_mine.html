<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
</head>

<body>

    <h1>Todo App</h1>

    <input type="text" placeholder="Enter Your Task">
    <button>Add Task</button>

    <ul>
        <li>sleep <button class="delete">Delete</button></li>
        <li>run <button class="delete">Delete</button></li>
    </ul>

    <script>

        let h1 = document.querySelector("h1");
        let input = document.querySelector("input");
        let btn = document.querySelector("button");
        let ul = document.querySelector("ul");

        // Initial Delete Buttons
        let dltbts = document.querySelectorAll(".delete");

        for (let btn of dltbts) {
            btn.addEventListener("click", function () {
                let par = this.parentElement;
                par.remove();
            });
        }

        btn.addEventListener("click", function () {

            let item = document.createElement("li");
            item.innerText = input.value;

            item.append("\u00A0\u00A0\u00A0");

            let dltBtn = document.createElement("button");
            dltBtn.innerText = "Delete";
            dltBtn.classList.add("delete");

            item.appendChild(dltBtn);
            ul.appendChild(item);

            input.value = "";

            // Naye button ke liye event listener
            dltBtn.addEventListener("click", function () {
                let par = this.parentElement;
                par.remove();
            });

        });

    </script>

</body>

</html>
