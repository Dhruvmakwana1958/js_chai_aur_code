<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events in JS</title>
    <link rel="stylesheet" href="01_2_style.css">
</head>

<body>
    <!-- This is our inline event handlers-->
    <button onclick="console.log('button was clicked'); alert('Hello!')">Click Me!</button>
    <button ondblclick="console.log('unique button')">Click Me 2</button>
    <div onmouseover="console.log('You are inside div')">This is a box</div><hr>

    <!-- External file -->
    <button type="button" id="btn">btn</button>

<!--IMPORTANT NOTE :- apde inline kareli event handle ane javascript throw kareli event handle banne ma javascript thi karela handle ni
priority vadhu hse  -->

    <script src="01_3_script.js"></script>

</body>

</html>
