    <script>
        let heading = document.querySelector('h3').classList
        console.log(heading)


        let heading2 = document.querySelector('h2').classList
        console.log(heading2)

        // add()
        let heading3 = document.querySelector('.fruits').classList
        heading3.add('green');

        let heading4 = document.querySelector('h1')

        // OR

        // console.log(heading4.classList);


        // remove()
        heading4.classList.remove("green")
        console.log(heading4.classList);

        //contains()
        console.log(heading4.classList.contains("green"));


        // toggle() switch jevu kam kare jo te class alredy hoy to ene remove kare ane no hoy to add kre

           console.log( heading4.classList.toggle("green"))
