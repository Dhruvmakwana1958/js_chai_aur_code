<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width: 600px;
            height: 300px;
            background-color:yellow;
            display: grid; /*  Grid no use simple words ma table create karva thy che */
            margin: 0 auto;
            /* grid-template-rows: 60px 60px 60px 60px 60px ;
            grid-template-columns: 200px 200px 200px; */
    
           /* grid-mtemplate-columns: auto auto auto;  jetli var auto karvo etli var equally width ma column devide thy pan dar vakhte avu nthi thatu 
            aa vastu ghna badha fector upar adhar rakhe */

            grid-template-rows: repeat(4,1fr);
            /* grid-template-rows: 1fr 1fr 1fr 1fr 1fr ; */

            grid-template-columns: repeat(3,1fr);
            /* grid-template-columns: 1fr 1fr 1fr ; */
            /*grid-template-columns: 1fr 3fr 1fr; */ /*ane aa rite pan lakhi sakay  2fr no mtlb jetli container ni width che ena thi 2 times
            vadhu jagya roke mtlb exectely two times ny but baki raheli jagya na 2 times*/

            row-gap: 15px;
            column-gap: 30px; 
            /* grid-gap: 15px 30px ;
            grid-gap: 30px; */



        }
        .item{
            /* height: 50px;
            width: 100px; */  /*jo aya height ane width property apply ny karvi to je te items ni width ane height grid-template-rows/columns
            pramane thy jse  */
            border: 2px solid black;
            background-color: yellowgreen;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center;">Grid Playground</h1>
    <div class="container">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
    </div>
</body>
</html>
