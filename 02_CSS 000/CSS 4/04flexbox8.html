<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      
      div {
        height: 100px;
        width: 200px;
        font-weight: 700;
        border: 2px solid black;
      }
      #container {
        height: 600px;
        width: 800px;
        border: 2px solid red ;
        display: flex ;
        flex-direction: row ;
        justify-content:center ;
        flex-wrap: wrap ;
        align-items: flex-start ;
      }
      #box1 {
        background-color: #670d2f ;
      }
      #box2 {
        background-color: #b03052 ;
        height: 200px ;
        align-self: flex-start ;
      }
      #box3 {
        background-color: #d76c82 ;
        height: 75px;
      }
      #box4 {
        background-color: #cae0bc ;
      }
      #box5 {
        background-color: #6e8e59 ;
        align-self: flex-end;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div id="box1">1</div>
      <div id="box2">2</div>
      <div id="box3">3</div>
      <div id="box4">4</div>
      <div id="box5">5</div>
    </div>
  </body>
</html>
