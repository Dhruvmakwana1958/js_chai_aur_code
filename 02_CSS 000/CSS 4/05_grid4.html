<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            background-color: pink;
            height: 700px;
            width: 800px;
            margin: 0 auto;
            display: grid;
            grid-template-rows: repeat(12, 1fr);
            grid-template-columns: repeat(12, 1fr);
            grid-gap: 10px;

        }

        .inner {
            border: 2px solid black;
            font-size: 20px;
        }

        #header {
            grid-column: 1/13;
            grid-row: 1/2;
        }

        #sidebar {
            grid-row: 2/12;
            grid-column: 1/4;
        }

        #navigation {
            grid-row: 2/3;
            grid-column: 4/10;
        }

        #ads {
            grid-row: 2/12;
            grid-column: 10/13;
        }

        #main {
            grid-row: 3/12;
            grid-column: 4/10;
        }

        #footer {
            grid-row: 12/13;
            grid-column: 1/13;
        }

        @media (max-width: 720px) {
            .inner {
                grid-column: 1/13;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="inner" id="header">header</div>
        <div class="inner" id="sidebar">sidebar</div>
        <div class="inner" id="navigation">navigation</div>
        <div class="inner" id="ads">ads</div>
        <div class="inner" id="main">main</div>
        <div class="inner" id="footer">footer</div>
    </div>
</body>

</html>
