<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width: 600px;
            height: 300px;
            background-color:yellow;
            display: grid; 
            margin: 0 auto;
            grid-template-rows: repeat(5,1fr);
            grid-template-columns: repeat(3,1fr);
        }
        .item{
            /* height: 50px;
            width: 100px;   */
            border: 2px solid black;
            background-color: yellowgreen;
            text-align: center;
        }

        /* self items mate */
        .one{
                                                                                                                        
            grid-column-start: 1;
            grid-column-end: 3;
             /*ahiya to apde height ane width nthi api but jo api hot ane te something 100px hot to pan te bija number na
            khana(cell) ni jagya roket*/

            /* OR
            grid-column: 1/3;
            grid-column: span 2; */

            grid-row-start: 1;
            grid-row-end: 4;

            /* OR
            grid-row: 1/4;
            grid-row: span 3;*/

        }

    </style>
</head>
<body>
    <h1 style="text-align: center;">Grid Playground</h1>
    <div class="container">
        <div class="item one">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
    </div>
</body>
</html>
