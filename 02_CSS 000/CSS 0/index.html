<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS level 1</title>
    <link rel="stylesheet" href="style.css"> <!-- External css file -->

    <style>
      p {
        color: blue; /*using style tag */
      }
      #user::placeholder{
        color: blueviolet;
      }
    </style>

  </head>
  <body>
    <h1 style="color: red">Hello from Dhruv !</h1> <!--Inline styling-->
    <p>I am learning CSS</p>
    <h2> Hello from Dhruv</h2>
    <label for="user">username : </label>
    <input type="text" placeholder="enter the username style" id="user" style="color: rgb(230, 23, 23);  background-color: lightblue;">

    <button>Click Me !</button>
  </body>
</html>
