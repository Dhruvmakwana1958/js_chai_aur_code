<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS level 1</title>
    <link rel="stylesheet" href="style.css"> <!-- External css file -->

    <style>
      p {
        color: blue; /*using style tag */
      }
      #user[placeholder]{
        background-color: darkblue;   /* ana thi input field select thse*/
        
      } 

      #user2::placeholder{
        color: darkblue;  /* ana thi aa proper placehoolder che teno color change thse */
        font-size: 30px;
        background-color: burlywood;
      }
      #user2[placeholder]{
        height: 100px;
        width: 300px;
      }
    </style>

  </head>
  <body>
    <h1 style="color: red">Hello from Dhruv !</h1> <!--Inline styling-->
    <p>I am learning CSS</p>
    <h2> Hello from Dhruv</h2>
    <label for="user">username : </label>
    <input type="text" placeholder="enter the username style" id="user" > <br> <hr>
    <label for="user2">username : </label>
    <input type="text" placeholder="enter the username style" id="user2" style="color: rgb(230, 23, 23);  background-color: lightblue;">

    <button>Click Me !</button>
  </body>
</html>
