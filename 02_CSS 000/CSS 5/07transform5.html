<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card{
            height: 300px;
            width: 225px;
            border: 2px solid black;
            display: inline-block;
            margin: 10px;
            border-radius: 5px;
            box-shadow: 0px 5px 8px rgb(0, 42, 0); 
            transition: all 0.5s ease-in-out 0.1ms;
        }
        .desc{
            padding: 0 3px 0 3px;
        }
        img{
            width: 100%;
            height: 70%;
            border-radius: 4px 4px 0 0 ; /*top-left top-right bottom-right bottom-left*/
        }

        .card:hover{
            box-shadow: 0px 15px 30px rgb(0, 42, 0); 
        }
       
    </style>
</head>
<body>
    <div class="card">
        <img src="/CSS 5/download.jpg" alt="male">
        <div class="desc">
            <h3>Dhruv Makwana</h3>
            <p>Data Analyst</p>
        </div>
    </div>

    <div class="card">
        <img src="/CSS 5/download (1).jpg" alt="female">
        <div class="desc">
            <h3>Shuddhi Nimbark</h3>
            <p>B.com</p>
        </div>
    </div>
</body>
</html>
