<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            height: 125px;
            width : 125px;
            border: 4px groove royalblue;
            margin: 20px;
            display: inline-block;
            background-color:darkseagreen;
        }

        #box1:active{
            transition-property: font-size ; /*tra-pro: font-size karva thi 3s nu duretion fakt ne fakt font-size ma j avshe backgrond color click 
            karta ni sathe j badalai jase
            but jo all rakhyu hot to font-size ni sathe sathe bkg clr badlva ma pan 3 sec lagse*/ 
            transition-duration: 3s;
            background-color: darkolivegreen;
            font-size: 25px;
            color: red;
        }
        #box2:hover{
            transition-property: all;
            transition-duration: 4s;
            transition-delay: 1s;
            text-transform:uppercase;
            transition-timing-function: ease-in;
            color: chocolate;
            background-color:steelblue;
            /*Shorthand
            transition: all 4s ease-in 2s;
            */
           
        }
        #box2:hover{
            transition-property: all;
            transition-duration: 4s;
            transition-delay: 1s;
            text-transform:uppercase;
            transition-timing-function: ease-in;
            color: chocolate;
            background-color:steelblue;
            /*Shorthand
            transition: all 4s ease-in 2s;
            */
           
        } 
        /* 
isme to mene transitioon ko hover ke andar
hi likha phir bhi work kar rha hai

Haan, hover ke andar transition likhne par bhi kabhi-kabhi effect dikh jata hai, lekin ye best practice nahi hai.

Tumhare code me:

#box2:hover {
    transition-property: all;
    transition-duration: 4s;
    transition-delay: 1s;
    transition-timing-function: ease-in;

    color: chocolate;
    background-color: steelblue;
}

Jab mouse #box2 par aata hai:

Browser transition property apply karta hai.
Saath hi color aur background-color bhi change hote hain.
Isliye hover enter karte waqt transition dikh sakta hai.

Lekin jab mouse hataoge:

#box2 {
     normal state 
}
to normal state me transition defined nahi hai, isliye wapas original color par aate waqt animation smooth na hokar instant ho sakta hai.
Isliye generally aise likhte hain:
#box2 {
    transition: all 4s ease-in 1s;
}
#box2:hover {
    color: chocolate;
    background-color: steelblue;
    text-transform: uppercase;
}
Is tarah:
Hover par jaate waqt bhi animation hogi.
Hover se bahar aate waqt bhi animation hogi.
Yahi reason hai ki transition ko normal selector me likhne ki recommendation di jaati hai. */

    </style>
</head>
<body>
    <div id="box1">Dhruv</div>
    <div id="box2">pankaj</div>

    
</body>
</html>
