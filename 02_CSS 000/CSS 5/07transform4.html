<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #box1 {
        height: 100px;
        width: 100px;
        background-color: aquamarine;
        border: 2px solid black;
        position: absolute;
        top: 200px;
        left: 300px;
        transition: all 8s ease-out ;
    }
    #box1:hover {
        transform: skew(360deg);
        
     
      }
      #box1:active {
        background-color: pink;
      }

      #box2{
        height: 100px;
        width: 100px;
        background-color: rgb(1, 83, 10);
        color: white;
        box-shadow: 5px        5px           10px        black;
              /* x-offset    y-offset   blur-radius      color
              blur-radius :- box pachad thi ketlu aagd upsi avse? */
      }
    </style>
  </head>
  <body>
    <div id="box1">This is box</div>
    <div id="box2">This is box</div>
  </body>
</html>
