<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .face {
            background-color: rgba(248, 213, 15, 0.911);
            height: 400px;
            width: 400px;
            border-radius: 50%;
        }

        .mouth {
            background-color: brown;
            height: 75px;
            width: 200px;
            border-radius: 0px 0px 50px 50px;
            position: absolute;
            top: 250px;
            left: 100px;
        }

        .left_eye,
        .right_eye {
            height: 70px;
            width: 50px;
            background-color: black;
            border-radius: 50%;
            display: inline-block;
            

        }
        .left_eye{
            position: absolute;
            left: 100px;
            top: 80px;
        }
        .right_eye{
            position: absolute;
            left: 250px;
            top: 80px;
        }
    </style>
</head>

<body>
    <div class="face">
        <div class="mouth"></div>
        <div class="eyes">
            <div class="left_eye" style="color: white; text-align: center;">⚪</div>
            <div class="right_eye" style="color: white; text-align: center;">⚪</div>
        </div>
    </div>
</body>

</html>
