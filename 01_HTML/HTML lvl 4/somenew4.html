    <!--html me video tag aur ifram dono ka kya alag alag use hai? kya ham dono ko ak dusre ke altenate me use kar sakte hai ?
    1. <video> Tag ka Use
    <video> tag direct video file chalane ke liye use hota hai.
    Example:
    <video controls width="300">
    <source src="video.mp4" type="video/mp4">
    </video>
Isme:
Video aapke computer/server me hoti hai
Aap direct MP4, WebM files play karte ho
Controls (play, pause, volume) milte hai


    2. <iframe> Tag ka Use
    <iframe> dusri website ya webpage ko embed karne ke liye use hota hai.
    Example:

    <iframe 
    width="300" 
    height="200"
    src="https://www.youtube.com/embed/VIDEO_ID">
    </iframe>
Isme:
YouTube video
Google Maps
Dusri websites
PDFs

embed kar sakte ho.-->
