   /*
================================================================================
                              HTTP HEADERS CHEATSHEET
================================================================================

[DEFINITION]
  HTTP Headers client (Browser/Hoppscotch/Postman) aur Server ke beech Request 
  ya Response ke sath extra information (Metadata) pass karne ke liye use hote hain.
  Ye main content (Body) se alag hote hain aur batate hain ki data ko kaise handle karna hai.

--------------------------------------------------------------------------------
                           MAIN FUNCTIONS (KEY ROLES)
--------------------------------------------------------------------------------
  1. Data Format Batana (Content-Type / Accept)
     - Server aur Client ko batata hai ki data kis format me bheja ya manga gaya hai.
  
  2. Authentication & Security (Authorization)
     - Private APIs ko access karne ke liye API Key ya Secret Token bhejta hai.
  
  3. Caching Control (Cache-Control)
     - Browser ko instructions deta hai ki data ko kitni der tak cache/save rakhna hai.
  
  4. Client Information (User-Agent)
     - Server ko batata hai ki request kis browser, OS, ya tool se aa rahi hai.

--------------------------------------------------------------------------------
                            COMMONLY USED HEADERS TABLE
--------------------------------------------------------------------------------
  +---------------------------+----------+------------------------------------+-------------------+
  | Header Name               | Type     | Kaam (Purpose)                     | Example Value     |
  +---------------------------+----------+------------------------------------+-------------------+
  | Accept                    | Request  | Client ko kis format me data chahiy| application/json  |
  | Content-Type              | Req/Res  | Bheje gaye data ka actual format   | application/json  |
  | Authorization             | Request  | Identity & Access Verify karna     | Bearer <token>    |
  | User-Agent                | Request  | Client Device / App ki Detail      | Mozilla/5.0...    |
  | Access-Control-Allow-Origin| Response | CORS Permission set karna          | * (All origins)   |
  +---------------------------+----------+------------------------------------+-------------------+

--------------------------------------------------------------------------------
                             REAL-WORLD HTTP EXAMPLE
--------------------------------------------------------------------------------
  [Request Payload]:
    GET /v1/books HTTP/1.1
    Host: api.potterdb.com
    Accept: application/json
    Authorization: Bearer my_api_key_123

  [Logic Breakdown]:
    - Accept Header        -> Server ko bol raha hai: "Mujhe response JSON me hi chahiye."
    - Authorization Header -> Server ko bol raha hai: "Main verified user hoon, ye raha mera token."

================================================================================
